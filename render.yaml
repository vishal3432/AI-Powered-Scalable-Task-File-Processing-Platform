services:

* type: web
  name: django-auth-service
  runtime: docker
  plan: standard
  repo: YOUR_GITHUB_REPO_URL
  rootDir: django_auth
  dockerfilePath: Dockerfile

  envVars:

  * key: DJANGO_SECRET_KEY
    sync: false

  * key: DJANGO_DEBUG
    value: "False"

  * key: DJANGO_ALLOWED_HOSTS
    value: "*.onrender.com"

  * key: POSTGRES_HOST
    fromDatabase:
    name: ai-platform-db
    property: host

  * key: POSTGRES_PORT
    fromDatabase:
    name: ai-platform-db
    property: port

  * key: POSTGRES_DB
    fromDatabase:
    name: ai-platform-db
    property: name

  * key: POSTGRES_USER
    fromDatabase:
    name: ai-platform-db
    property: user

  * key: POSTGRES_PASSWORD
    fromDatabase:
    name: ai-platform-db
    property: password

  * key: JWT_SECRET_KEY
    sync: false

  * key: FASTAPI_BASE_URL
    value: "https://fastapi-processor-service.onrender.com"

  healthCheckPath: /auth/health/

  buildCommand: |
  pip install -r requirements.txt
  python manage.py collectstatic --noinput

  startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:8000

* type: web
  name: fastapi-processor-service
  runtime: docker
  plan: standard
  repo: YOUR_GITHUB_REPO_URL
  rootDir: fastapi_processor
  dockerfilePath: Dockerfile

  envVars:

  * key: POSTGRES_HOST
    fromDatabase:
    name: ai-platform-db
    property: host

  * key: POSTGRES_PORT
    fromDatabase:
    name: ai-platform-db
    property: port

  * key: POSTGRES_DB
    fromDatabase:
    name: ai-platform-db
    property: name

  * key: POSTGRES_USER
    fromDatabase:
    name: ai-platform-db
    property: user

  * key: POSTGRES_PASSWORD
    fromDatabase:
    name: ai-platform-db
    property: password

  * key: JWT_SECRET_KEY
    sync: false

  * key: OPENAI_API_KEY
    sync: false

  * key: DJANGO_BASE_URL
    value: "https://django-auth-service.onrender.com"

  healthCheckPath: /health

  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port 8000

* type: pserv
  name: ai-platform-db
  plan: starter
  env: postgres
