services:
  - type: web
    name: django-auth-service
    plan: free
    runtime: docker
    repo: https://github.com/vishal3432/AI-Powered-Scalable-Task-File-Processing-Platform
    rootDir: django_auth
    dockerfilePath: Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        value: CHANGE_ME_RUN_openssl_rand_hex_50
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
      - key: POSTGRES_HOST
        value: YOUR_DATABASE_HOST_HERE
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: ai_platform
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: CHANGE_ME_YOUR_DATABASE_PASSWORD
      - key: JWT_SECRET_KEY
        value: CHANGE_ME_RUN_openssl_rand_hex_50
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000"

  - type: web
    name: fastapi-processor-service
    plan: free
    runtime: docker
    repo: https://github.com/vishal3432/AI-Powered-Scalable-Task-File-Processing-Platform
    rootDir: fastapi_processor
    dockerfilePath: Dockerfile
    envVars:
      - key: POSTGRES_HOST
        value: YOUR_DATABASE_HOST_HERE
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: ai_platform
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: CHANGE_ME_YOUR_DATABASE_PASSWORD
      - key: JWT_SECRET_KEY
        value: CHANGE_ME_SAME_AS_DJANGO_JWT_SECRET_KEY
      - key: OPENAI_API_KEY
        value: sk-your-actual-openai-api-key
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000"
      - key: AI_MODEL
        value: "gpt-3.5-turbo"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: ENV
        value: "production"
