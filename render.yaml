services:

# ─────────────────────────────────────────

# Django Authentication Service

# ─────────────────────────────────────────

* type: web
  name: django-auth-service
  plan: standard
  runtime: docker
  repo: YOUR_GITHUB_REPO_URL
  rootDir: django_auth
  dockerfilePath: Dockerfile

  envVars:

  * key: DJANGO_SECRET_KEY
    sync: false

  * key: DJANGO_DEBUG
    value: "False"

  * key: DJANGO_ALLOWED_HOSTS
    value: "*.onrender.com"

  * key: POSTGRES_HOST
    fromDatabase:
    name: ai-platform-db
    property: host

  * key: POSTGRES_PORT
    fromDatabase:
    name: ai-platform-db
    property: port

  * key: POSTGRES_DB
    fromDatabase:
    name: ai-platform-db
    property: name

  * key: POSTGRES_USER
    fromDatabase:
    name: ai-platform-db
    property: user

  * key: POSTGRES_PASSWORD
    fromDatabase:
    name: ai-platform-db
    property: password

  * key: JWT_SECRET_KEY
    sync: false

  * key: FASTAPI_BASE_URL
    value: "https://fastapi-processor-service.onrender.com"

  * key: CORS_ALLOWED_ORIGINS
    value: "https://YOUR_FRONTEND_DOMAIN.com,https://*.onrender.com"

  healthCheckPath: /auth/health/

  buildCommand: |
  pip install -r requirements.txt
  python manage.py collectstatic --noinput

  startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60

  initialDeployHook: python manage.py migrate --noinput

# ─────────────────────────────────────────

# FastAPI Processing Service

# ─────────────────────────────────────────

* type: web
  name: fastapi-processor-service
  plan: standard
  runtime: docker
  repo: YOUR_GITHUB_REPO_URL
  rootDir: fastapi_processor
  dockerfilePath: Dockerfile

  envVars:

  * key: POSTGRES_HOST
    fromDatabase:
    name: ai-platform-db
    property: host

  * key: POSTGRES_PORT
    fromDatabase:
    name: ai-platform-db
    property: port

  * key: POSTGRES_DB
    fromDatabase:
    name: ai-platform-db
    property: name

  * key: POSTGRES_USER
    fromDatabase:
    name: ai-platform-db
    property: user

  * key: POSTGRES_PASSWORD
    fromDatabase:
    name: ai-platform-db
    property: password

  * key: JWT_SECRET_KEY
    sync: false

  * key: OPENAI_API_KEY
    sync: false

  * key: DJANGO_BASE_URL
    value: "https://django-auth-service.onrender.com"

  * key: CORS_ALLOWED_ORIGINS
    value: "https://YOUR_FRONTEND_DOMAIN.com,https://django-auth-service.onrender.com"

  * key: AI_MODEL
    value: "gpt-3.5-turbo"

  * key: MAX_FILE_SIZE_MB
    value: "10"

  * key: ENV
    value: "production"

  healthCheckPath: /health

  buildCommand: pip install -r requirements.txt

  startCommand: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

# ─────────────────────────────────────────

# PostgreSQL Database

# ─────────────────────────────────────────

* type: pserv
  name: ai-platform-db
  plan: starter
  env: postgres
