services:
  - type: web
    name: django-auth-service
    plan: free
    runtime: docker
    repo: YOUR_GITHUB_REPO_URL
    rootDir: django_auth
    dockerfilePath: Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        value: CHANGE_ME_RUN_openssl_rand_hex_50
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*.onrender.com,localhost"
      - key: POSTGRES_HOST
        fromDatabase:
          name: ai-platform-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ai-platform-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: ai-platform-db
          property: name
      - key: POSTGRES_USER
        fromDatabase:
          name: ai-platform-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ai-platform-db
          property: password
      - key: JWT_SECRET_KEY
        value: CHANGE_ME_RUN_openssl_rand_hex_50
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60

  - type: web
    name: fastapi-processor-service
    plan: free
    runtime: docker
    repo: YOUR_GITHUB_REPO_URL
    rootDir: fastapi_processor
    dockerfilePath: Dockerfile
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: ai-platform-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ai-platform-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: ai-platform-db
          property: name
      - key: POSTGRES_USER
        fromDatabase:
          name: ai-platform-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ai-platform-db
          property: password
      - key: JWT_SECRET_KEY
        value: CHANGE_ME_SAME_AS_DJANGO_JWT_SECRET_KEY
      - key: OPENAI_API_KEY
        value: sk-your-actual-openai-api-key
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000"
      - key: AI_MODEL
        value: "gpt-3.5-turbo"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: ENV
        value: "production"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2

  - type: pserv
    name: ai-platform-db
    plan: free
